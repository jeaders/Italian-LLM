# Per budget limitato (100€/mese) usa modelli leggeri girabili in locale su CPU/Metal
# Modelli consigliati: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B, microsoft/Phi-2, Qwen/Qwen2.5-1.5B-Instruct
model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
# Usa il dataset locale invece di quello remoto
dataset_path: "data/processed/survival_instructions.json"
output_dir: "./models/adapter/pippo-survival"
max_seq_length: 1024

training:
  epochs: 3
  batch_size: 2
  gradient_accumulation: 8
  learning_rate: 2e-4
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  fp16: true
  optim: "paged_adamw_8bit"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

use_wandb: false
