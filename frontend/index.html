<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Italian LLM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";
    window.webllm = webllm;
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    body { font-family: 'Inter', sans-serif; }

    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }

    .typing-dot { animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .glass { background: rgba(20,24,36,0.65); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-strong { background: rgba(10,13,22,0.8); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.12); }

    .input-field { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s ease; }
    .input-field:focus { outline: none; border-color: rgba(99,102,241,0.45); box-shadow: 0 0 0 3px rgba(99,102,241,0.08); }

    .pill { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); transition: all 0.15s ease; }
    .pill:hover { background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.35); transform: translateY(-1px); }

    .bubble-user { background: linear-gradient(135deg, #6366f1, #4f46e5); }
    .bubble-assistant { background: rgba(30,34,48,0.9); border: 1px solid rgba(255,255,255,0.07); }

    .sidebar-item { transition: all 0.15s ease; }
    .sidebar-item:hover { background: rgba(255,255,255,0.04); }

    .cmd-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.35s cubic-bezier(0.22,1,0.36,1) forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden antialiased">

  <aside id="sidebar" class="w-72 bg-slate-900/80 border-r border-slate-800 flex flex-col transition-transform duration-200 ease-in-out">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-lg">🇮🇹</span>
        <span class="font-semibold text-brand-400">Italian LLM</span>
      </div>
      <button id="newChat" class="text-xs bg-brand-600 hover:bg-brand-500 text-white px-2.5 py-1.5 rounded-lg transition-colors">Nuova chat</button>
    </div>

    <div class="p-3">
      <input id="searchChats" type="text" placeholder="🔍 Cerca conversazioni..." class="input-field w-full rounded-xl px-3 py-2 text-xs text-slate-100 placeholder:text-slate-500" />
    </div>

    <div id="history" class="flex-1 overflow-y-auto chat-scroll px-2 space-y-1"></div>

    <div class="p-3 border-t border-slate-800 space-y-2">
      <button id="exportAllBtn" class="w-full text-left px-3 py-2 rounded-lg sidebar-item text-xs text-slate-300">📤 Esporta tutte le chat</button>
      <button id="importAllBtn" class="w-full text-left px-3 py-2 rounded-lg sidebar-item text-xs text-slate-300">📥 Importa chat</button>
      <input id="importAllInput" type="file" accept="application/json" class="hidden" />
      <div class="text-[10px] text-slate-500 text-center">Backend: <span id="apiStatus" class="text-slate-300">-</span></div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 relative">
    <header class="h-14 border-b border-slate-800 flex items-center px-4 gap-3 bg-slate-900/60">
      <button id="toggleSidebar" class="md:hidden text-slate-300 hover:text-white text-xl">☰</button>
      <button id="sidebarToggleDesktop" class="hidden md:block text-slate-400 hover:text-white transition-colors">☰</button>
      <div class="font-medium text-sm">Chat</div>
      <div class="ml-auto flex items-center gap-2">
        <span id="backendLabel" class="hidden md:inline text-xs text-slate-400">Backend: -</span>
        <span id="toolBadge" class="hidden px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200 text-[10px]"></span>
        <button id="settingsBtn" class="pill text-xs px-2.5 py-1.5 rounded-lg text-slate-300">⚙️</button>
      </div>
    </header>

    <div id="chat" class="flex-1 overflow-y-auto chat-scroll">
      <div id="emptyState" class="h-full flex flex-col items-center justify-center text-slate-400 gap-3 p-6 text-center">
        <div class="text-5xl">🇮🇹</div>
        <div class="text-xl font-medium text-slate-200">Italian LLM</div>
        <div class="text-sm max-w-md">Il tuo assistente AI italiano. Usa <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-xs">Cmd+K</kbd> per i suggerimenti rapidi.</div>
        <div class="flex gap-2 mt-2">
          <button class="template-btn pill text-xs px-3 py-1.5 rounded-full text-slate-300" data-prompt="Spiega la relatività generale in modo semplice">🌌 Relatività</button>
          <button class="template-btn pill text-xs px-3 py-1.5 rounded-full text-slate-300" data-prompt="Scrivi una mail formale per chiedere un aumento">📧 Mail formale</button>
          <button class="template-btn pill text-xs px-3 py-1.5 rounded-full text-slate-300" data-prompt="Dammi 3 idee per un viaggio in Sicilia">✈️ Viaggio</button>
        </div>
      </div>
    </div>

    <div class="p-3 border-t border-slate-800 bg-slate-900/60">
      <form id="chatForm" class="flex gap-2">
        <input id="message" type="text" placeholder="Scrivi un messaggio..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-brand-500" />
        <button type="submit" id="sendBtn" class="bg-brand-600 hover:bg-brand-500 disabled:opacity-50 text-white px-4 py-2 rounded-xl transition-colors">Invia</button>
      </form>
    </div>
  </main>

  <div id="settingsModal" class="hidden fixed inset-0 z-50 cmd-overlay flex items-center justify-center p-4">
    <div class="glass-strong rounded-2xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Impostazioni</h2>
        <button id="closeSettings" class="text-slate-400 hover:text-white text-xl">×</button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1.5">Provider</label>
          <select id="providerSelect" class="input-field w-full rounded-xl px-3 py-2 text-sm text-slate-100">
            <option value="auto">Auto</option>
            <option value="groq">Groq</option>
            <option value="webllm">WebLLM (browser, no API key)</option>
            <option value="backend">Backend locale</option>
          </select>
        </div>
        <div id="groqSettings">
          <label class="block text-xs text-slate-400 mb-1.5">Groq API Key</label>
          <input id="settingsGroqKey" type="password" placeholder="gsk_..." class="input-field w-full rounded-xl px-3 py-2 text-sm text-slate-100 mb-2" />
          <label class="block text-xs text-slate-400 mb-1.5">Modello</label>
          <select id="settingsGroqModel" class="input-field w-full rounded-xl px-3 py-2 text-sm text-slate-100">
            <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
            <option value="gemma2-9b-it">gemma2-9b-it</option>
            <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
            <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
          </select>
        </div>
        <div id="webllmSettings" class="hidden">
          <label class="block text-xs text-slate-400 mb-1.5">Modello browser</label>
          <select id="settingsWebLLMModel" class="input-field w-full rounded-xl px-3 py-2 text-sm text-slate-100">
            <option value="Llama-3.2-1B-Instruct-q4f32_1-MLC">Llama 3.2 1B (veloce, leggero)</option>
            <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B (bilanciato)</option>
            <option value="Phi-3.5-mini-instruct-q4f32_1-MLC">Phi 3.5 Mini (competente, leggero)</option>
            <option value="Qwen2.5-1.5B-Instruct-q4f32_1-MLC">Qwen 2.5 1.5B (multilingua)</option>
            <option value="gemma-2-2b-it-q4f32_1-MLC">Gemma 2 2B (Google, veloce)</option>
          </select>
          <p class="text-[10px] text-slate-500 mt-2">Il modello viene scaricato e memorizzato nel browser. Nessuna API key richiesta. Richiede WebGPU.</p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1.5">Temperatura</label>
          <input id="settingsTemperature" type="range" min="0" max="1.5" step="0.1" value="0.7" class="w-full" />
          <div class="flex justify-between text-[10px] text-slate-500"><span>0</span><span id="tempValue">0.7</span><span>1.5</span></div>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-300">Web search</span>
          <input id="settingsWebSearch" type="checkbox" class="accent-brand-500" />
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-300">RAG</span>
          <input id="settingsRag" type="checkbox" class="accent-brand-500" />
        </div>
      </div>
      <button id="saveSettings" class="mt-4 w-full bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium py-2 rounded-xl transition-colors">Salva</button>
    </div>
  </div>

  <div id="cmdPalette" class="hidden fixed inset-0 z-50 cmd-overlay flex items-start justify-center pt-24 px-4">
    <div class="glass-strong rounded-2xl p-2 w-full max-w-lg">
      <input id="cmdInput" type="text" placeholder="Scrivi un comando o cerca..." class="w-full bg-transparent border-b border-slate-800 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none" />
      <div id="cmdResults" class="mt-2 max-h-64 overflow-y-auto chat-scroll"></div>
    </div>
  </div>

  <script>
    const API_BASE = (location.protocol === 'https:' ? 'https://' : 'http://') + location.hostname + ':8000';
    const GROQ_KEY = localStorage.getItem('groq_api_key') || '';
    const GROQ_MODEL_KEY = 'groq_model';
    const GROQ_DEFAULT_MODEL = 'llama-3.1-70b-versatile';
    let groqModel = localStorage.getItem(GROQ_MODEL_KEY) || GROQ_DEFAULT_MODEL;
    let currentConversationId = 'default';
    let conversations = JSON.parse(localStorage.getItem('llm_conversations') || '{}');
    let settings = JSON.parse(localStorage.getItem('llm_settings') || '{}');

    const defaultSettings = { provider: 'auto', temperature: 0.7, webSearch: false, rag: true };
    settings = { ...defaultSettings, ...settings };

    let webLLMEngine = null;
    let webLLMReady = false;

    const chatEl = document.getElementById('chat');
    const emptyState = document.getElementById('emptyState');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('message');
    const sendBtn = document.getElementById('sendBtn');
    const apiStatus = document.getElementById('apiStatus');
    const backendLabel = document.getElementById('backendLabel');
    const toolBadge = document.getElementById('toolBadge');
    const historyEl = document.getElementById('history');
    const searchInput = document.getElementById('searchChats');

    function saveConversation(id, history) {
      conversations[id] = { history, updatedAt: Date.now() };
      localStorage.setItem('llm_conversations', JSON.stringify(conversations));
      renderHistory();
    }

    function loadConversation(id) {
      currentConversationId = id;
      renderChat();
      if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
    }

    function renderHistory() {
      const term = (searchInput?.value || '').toLowerCase();
      historyEl.innerHTML = '';
      const sorted = Object.entries(conversations).sort((a,b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));
      for (const [id, convo] of sorted) {
        const title = convo.history?.[0]?.user || 'Nuova chat';
        if (term && !title.toLowerCase().includes(term)) continue;
        const item = document.createElement('button');
        item.className = 'w-full text-left px-3 py-2 rounded-lg sidebar-item text-sm text-slate-200 truncate flex items-center justify-between gap-2';
        item.innerHTML = `<span class="truncate">${escapeHtml(title)}</span><span class="text-[10px] text-slate-500">${new Date(convo.updatedAt || Date.now()).toLocaleDateString('it-IT')}</span>`;
        item.onclick = () => loadConversation(id);
        historyEl.appendChild(item);
      }
    }

    function renderChat() {
      const history = conversations[currentConversationId]?.history || [];
      chatEl.innerHTML = '';
      if (!history.length) {
        chatEl.appendChild(emptyState);
        emptyState.style.display = 'flex';
      } else {
        emptyState.style.display = 'none';
        history.forEach(turn => appendBubble(turn.role, turn.content, turn.meta, false));
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function appendBubble(role, text, meta = {}, animate = true) {
      if (emptyState) emptyState.style.display = 'none';
      const row = document.createElement('div');
      row.className = `max-w-3xl mx-auto w-full px-4 py-3 ${role === 'user' ? 'flex justify-end' : 'flex justify-start'} ${animate ? 'fade-in' : ''}`;
      const bubble = document.createElement('div');
      bubble.className = `max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${role === 'user' ? 'bubble-user text-white rounded-br-sm' : 'bubble-assistant text-slate-100 rounded-bl-sm'}`;
      bubble.textContent = text;
      row.appendChild(bubble);

      if (meta?.tools_used?.length) {
        const tools = document.createElement('div');
        tools.className = 'mt-1 flex flex-wrap gap-1 ' + (role === 'user' ? 'justify-end' : 'justify-start');
        tools.innerHTML = meta.tools_used.map(t => `<span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-200">${t}</span>`).join('');
        row.appendChild(tools);
      }
      if (meta?.sources?.length) {
        const sources = document.createElement('div');
        sources.className = 'mt-2 text-xs text-slate-400 ' + (role === 'user' ? 'text-right' : 'text-left');
        sources.textContent = '📚 Fonti: ' + meta.sources.slice(0,3).map(s => s.substring(0, 60)).join(' | ');
        row.appendChild(sources);
      }
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function typingIndicator() {
      const row = document.createElement('div');
      row.id = 'typingIndicator';
      row.className = 'max-w-3xl mx-auto w-full px-4 py-3 flex justify-start fade-in';
      row.innerHTML = '<div class="bubble-assistant rounded-2xl rounded-bl-sm px-4 py-3 flex gap-1 items-center"><div class="typing-dot w-2 h-2 bg-slate-400 rounded-full"></div><div class="typing-dot w-2 h-2 bg-slate-400 rounded-full"></div><div class="typing-dot w-2 h-2 bg-slate-400 rounded-full"></div></div>';
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function checkHealth() {
      const provider = settings.provider;
      if (provider === 'groq') {
        apiStatus.textContent = 'groq';
        backendLabel.textContent = 'Backend: Groq';
        apiStatus.className = 'text-brand-400';
        return;
      }
      if (provider === 'webllm') {
        apiStatus.textContent = webLLMReady ? 'webllm' : 'loading';
        backendLabel.textContent = 'Backend: WebLLM' + (webLLMReady ? '' : ' (caricamento...)');
        apiStatus.className = webLLMReady ? 'text-neon-400' : 'text-amber-400';
        return;
      }
      try {
        const res = await fetch(API_BASE + '/health');
        const data = await res.json();
        apiStatus.textContent = data.status === 'healthy' ? 'online' : 'degraded';
        backendLabel.textContent = 'Backend: ' + (data.backend || '-');
        apiStatus.className = data.status === 'healthy' ? 'text-emerald-400' : 'text-amber-400';
      } catch (e) {
        apiStatus.textContent = 'offline';
        backendLabel.textContent = 'Backend: -';
        apiStatus.className = 'text-red-400';
      }
    }

    async function sendMessage(text) {
      const message = text || input.value.trim();
      if (!message) return;
      input.value = '';
      sendBtn.disabled = true;
      appendBubble('user', message);
      typingIndicator();
      const useWebSearch = settings.webSearch;
      const useRag = settings.rag;
      const temperature = settings.temperature || 0.7;
      const provider = settings.provider;
      const groqKey = (document.getElementById('settingsGroqKey')?.value || GROQ_KEY || '').trim();

      try {
        if (provider === 'groq' || (provider === 'auto' && groqKey)) {
          if (!groqKey) throw new Error('Inserisci la API key di Groq nelle impostazioni');
          const model = document.getElementById('settingsGroqModel')?.value || groqModel;
          const groqRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + groqKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ model, messages: [{ role: 'user', content: message }], max_tokens: 512, temperature })
          });
          if (!groqRes.ok) {
            const errText = await groqRes.text();
            let friendly = 'Groq ' + groqRes.status + ': ' + errText;
            if (groqRes.status === 404) friendly = 'Modello non disponibile: ' + model + '. Prova a cambiare modello dalle impostazioni.';
            if (groqRes.status === 400 && errText.includes('decommissioned')) friendly = 'Modello deprecato: ' + model + '. Scegli un modello aggiornato dalle impostazioni (es. llama-3.3-70b-versatile, gemma2-9b-it, mixtral-8x7b-32768).';
            throw new Error(friendly);
          }
          const groqData = await groqRes.json();
          const reply = groqData.choices?.[0]?.message?.content || 'Errore nella risposta Groq';
          removeTypingIndicator();
          appendBubble('assistant', reply);
          const history = (conversations[currentConversationId]?.history || []).concat([{ role: 'user', content: message }, { role: 'assistant', content: reply }]);
          saveConversation(currentConversationId, history);
        } else if (provider === 'webllm') {
          const reply = await webllmReply(message, temperature);
          removeTypingIndicator();
          appendBubble('assistant', reply);
          const history = (conversations[currentConversationId]?.history || []).concat([{ role: 'user', content: message }, { role: 'assistant', content: reply }]);
          saveConversation(currentConversationId, history);
        } else {
          const res = await fetch(API_BASE + '/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, conversation_id: currentConversationId, use_web_search: useWebSearch, use_rag: useRag, max_tokens: 512, temperature }),
          });
          const data = await res.json();
          removeTypingIndicator();
          appendBubble('assistant', data.response || 'Errore', { tools_used: data.tools_used, sources: data.sources });
          currentConversationId = data.conversation_id;
          const history = (conversations[currentConversationId]?.history || []).concat([{ role: 'user', content: message }, { role: 'assistant', content: data.response, meta: { tools_used: data.tools_used, sources: data.sources } }]);
          saveConversation(currentConversationId, history);
          if (data.tools_used?.length) {
            toolBadge.textContent = 'Tool: ' + data.tools_used.join(', ');
            toolBadge.classList.remove('hidden');
          }
        }
      } catch (e) {
        removeTypingIndicator();
        appendBubble('assistant', 'Errore: ' + e.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function ensureWebLLM(model) {
      if (webLLMReady && webLLMEngine) return webLLMEngine;
      const webllm = window.webllm;
      if (!webllm) throw new Error('WebLLM non è disponibile in questa pagina.');
      webLLMEngine = await webllm.CreateMLCEngine(model, { initProgressCallback: (p) => {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.querySelector('div')?.remove();
        const row = document.createElement('div');
        row.id = 'typingIndicator';
        row.className = 'max-w-3xl mx-auto w-full px-4 py-3 flex justify-start fade-in';
        row.innerHTML = `<div class="bubble-assistant rounded-2xl rounded-bl-sm px-4 py-3 text-xs text-slate-300">Caricamento modello WebLLM: ${Math.round((p.progress || 0) * 100)}%</div>`;
        chatEl.appendChild(row);
        chatEl.scrollTop = chatEl.scrollHeight;
      }});
      webLLMReady = true;
      return webLLMEngine;
    }

    async function webllmReply(message, temperature) {
      const model = document.getElementById('settingsWebLLMModel')?.value || 'Llama-3.2-1B-Instruct-q4f32_1-MLC';
      const engine = await ensureWebLLM(model);
      const reply = await engine.chat.completions.create({
        messages: [{ role: 'user', content: message }],
        max_tokens: 512,
        temperature,
        stream: false
      });
      return reply.choices?.[0]?.message?.content || 'Errore nella risposta WebLLM';
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });
    document.getElementById('newChat').addEventListener('click', () => {
      currentConversationId = 'chat-' + Date.now();
      saveConversation(currentConversationId, []);
      renderChat();
      input.focus();
    });
    searchInput?.addEventListener('input', renderHistory);

    document.getElementById('exportAllBtn')?.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(conversations, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'italian-llm-chats.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importAllBtn')?.addEventListener('click', () => document.getElementById('importAllInput')?.click());
    document.getElementById('importAllInput')?.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          conversations = { ...conversations, ...parsed };
          localStorage.setItem('llm_conversations', JSON.stringify(conversations));
          renderHistory();
        } catch (err) { alert('Errore importazione: ' + err.message); }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettings = document.getElementById('closeSettings');
    const saveSettingsBtn = document.getElementById('saveSettings');

    function openSettings() {
      settingsModal.classList.remove('hidden');
      document.getElementById('settingsGroqKey').value = localStorage.getItem('groq_api_key') || '';
      document.getElementById('settingsGroqModel').value = groqModel;
      document.getElementById('settingsTemperature').value = settings.temperature;
      document.getElementById('tempValue').textContent = settings.temperature;
      document.getElementById('settingsWebSearch').checked = settings.webSearch;
      document.getElementById('settingsRag').checked = settings.rag;
      document.getElementById('providerSelect').value = settings.provider;
      document.getElementById('settingsWebLLMModel').value = localStorage.getItem('webllm_model') || 'Llama-3.2-1B-Instruct-q4f32_1-MLC';
      toggleProviderSettings(settings.provider);
    }
    function closeSettingsModal() { settingsModal.classList.add('hidden'); }

    function toggleProviderSettings(provider) {
      const groqEl = document.getElementById('groqSettings');
      const webllmEl = document.getElementById('webllmSettings');
      if (!groqEl || !webllmEl) return;
      groqEl.classList.toggle('hidden', provider !== 'groq');
      webllmEl.classList.toggle('hidden', provider !== 'webllm');
    }

    settingsBtn?.addEventListener('click', openSettings);
    closeSettings?.addEventListener('click', closeSettingsModal);
    saveSettingsBtn?.addEventListener('click', () => {
      const groqKey = document.getElementById('settingsGroqKey').value.trim();
      const model = document.getElementById('settingsGroqModel').value;
      const temperature = parseFloat(document.getElementById('settingsTemperature').value);
      const webSearch = document.getElementById('settingsWebSearch').checked;
      const rag = document.getElementById('settingsRag').checked;
      const provider = document.getElementById('providerSelect').value;
      const webllmModel = document.getElementById('settingsWebLLMModel')?.value || 'Llama-3.2-1B-Instruct-q4f32_1-MLC';
      localStorage.setItem('groq_api_key', groqKey);
      localStorage.setItem(GROQ_MODEL_KEY, model);
      localStorage.setItem('webllm_model', webllmModel);
      localStorage.setItem('llm_settings', JSON.stringify({ provider, temperature, webSearch, rag }));
      settings = { provider, temperature, webSearch, rag };
      groqModel = model;
      closeSettingsModal();
      checkHealth();
    });

    document.getElementById('providerSelect')?.addEventListener('change', (e) => toggleProviderSettings(e.target.value));

    document.getElementById('settingsTemperature')?.addEventListener('input', (e) => {
      document.getElementById('tempValue').textContent = e.target.value;
    });

    const cmdPalette = document.getElementById('cmdPalette');
    const cmdInput = document.getElementById('cmdInput');
    const cmdResults = document.getElementById('cmdResults');

    function openCmd() {
      cmdPalette.classList.remove('hidden');
      cmdInput.value = '';
      cmdInput.focus();
      renderCmdResults('');
    }
    function closeCmd() { cmdPalette.classList.add('hidden'); }

    function renderCmdResults(term) {
      const t = term.toLowerCase();
      const items = [
        { label: 'Nuova chat', action: () => { closeCmd(); document.getElementById('newChat').click(); } },
        { label: 'Impostazioni', action: () => { closeCmd(); openSettings(); } },
        { label: 'Cerca conversazioni', action: () => { closeCmd(); searchInput.focus(); } },
        { label: 'Esporta chat', action: () => { closeCmd(); document.getElementById('exportAllBtn')?.click(); } },
        { label: 'Spiega la relatività', action: () => { closeCmd(); sendMessage('Spiega la relatività generale in modo semplice'); } },
        { label: 'Mail formale', action: () => { closeCmd(); sendMessage('Scrivi una mail formale per chiedere un aumento'); } },
        { label: 'Idee viaggio Sicilia', action: () => { closeCmd(); sendMessage('Dammi 3 idee per un viaggio in Sicilia di 5 giorni'); } },
      ];
      const filtered = t ? items.filter(i => i.label.toLowerCase().includes(t)) : items;
      cmdResults.innerHTML = filtered.map(i => `<button class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-sm text-slate-200 transition-colors">${escapeHtml(i.label)}</button>`).join('');
      cmdResults.querySelectorAll('button').forEach((btn, idx) => {
        btn.addEventListener('click', () => { if (filtered[idx]) filtered[idx].action(); });
      });
    }

    cmdInput?.addEventListener('input', (e) => renderCmdResults(e.target.value));
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCmd(); }
      if (e.key === 'Escape') closeCmd();
    });
    cmdPalette?.addEventListener('click', (e) => { if (e.target === cmdPalette) closeCmd(); });

    document.querySelectorAll('.template-btn').forEach(btn => {
      btn.addEventListener('click', () => sendMessage(btn.dataset.prompt));
    });

    document.getElementById('toggleSidebar')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    });
    document.getElementById('sidebarToggleDesktop')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('hidden');
    });

    renderHistory();
    renderChat();
    checkHealth();
    setInterval(checkHealth, 15000);
  </script>
</body>
</html>
